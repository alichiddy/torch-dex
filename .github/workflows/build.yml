name: build-torch-dex

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -1)"
          fi

          echo "sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platforms;android-31" \
            "build-tools;34.0.0"

      - name: Compile and dex
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk

          AJ="$ANDROID_HOME/platforms/android-31/android.jar"
          BT="$ANDROID_HOME/build-tools/34.0.0"

          echo "Android SDK: $ANDROID_HOME"
          echo "android.jar: $AJ"
          echo "d8: $BT/d8"

          test -f "$AJ"
          test -x "$BT/d8"

          mkdir -p classes out

          javac \
            -source 8 \
            -target 8 \
            -cp "$AJ" \
            -d classes \
            Torch.java

          "$BT/d8" \
            --lib "$AJ" \
            --min-api 31 \
            --output out \
            classes/Torch.class

          mv out/classes.dex torch.dex

          ls -lh torch.dex
          sha256sum torch.dex

      - name: Upload torch.dex
        uses: actions/upload-artifact@v4
        with:
          name: torch-dex
          path: torch.dex
