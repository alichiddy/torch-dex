name: build-torch-dex

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-31" "build-tools;34.0.0"

      - name: Compile and dex
        run: |
          AJ="$ANDROID_HOME/platforms/android-31/android.jar"
          BT="$ANDROID_HOME/build-tools/34.0.0"

          mkdir -p classes out

          javac \
            -source 8 \
            -target 8 \
            -cp "$AJ" \
            -d classes \
            Torch.java

          "$BT/d8" \
            --lib "$AJ" \
            --min-api 31 \
            --output out \
            classes/Torch.class

          mv out/classes.dex torch.dex

          ls -lh torch.dex

      - uses: actions/upload-artifact@v4
        with:
          name: torch-dex
          path: torch.dex
